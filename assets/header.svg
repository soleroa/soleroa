<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pop { animation: pop .7s ease-out both; transform-origin: center; transform-box: fill-box; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>

  <!-- background -->
  <rect width="1200" height="340" fill="#F6F3EC"/>
  <g fill="#E2DCCD">
    <circle cx="40" cy="40" r="1.6"/><circle cx="64" cy="40" r="1.6"/><circle cx="40" cy="64" r="1.6"/>
    <circle cx="1160" cy="300" r="1.6"/><circle cx="1136" cy="300" r="1.6"/><circle cx="1160" cy="276" r="1.6"/>
  </g>

  <!-- window -->
  <rect x="76" y="42" width="1050" height="262" rx="12" fill="#E4DED0"/>
  <rect x="70" y="36" width="1050" height="262" rx="12" fill="#FFFDF8" stroke="#2B2A28" stroke-width="1.6"/>

  <!-- title bar -->
  <path d="M70 48 a12 12 0 0 1 12 -12 h1026 a12 12 0 0 1 12 12 v22 h-1050 z" fill="#F1ECE1" stroke="#2B2A28" stroke-width="1.6"/>
  <circle cx="94" cy="53" r="5.5" fill="#C8553D"/>
  <circle cx="112" cy="53" r="5.5" fill="#D9B26F"/>
  <circle cx="130" cy="53" r="5.5" fill="#2F6F73"/>
  <text x="595" y="57" text-anchor="middle" class="mono" font-size="13" fill="#8A857A">~/soleroa</text>

  <!-- content -->
  <text x="110" y="126" class="mono pop" font-size="16" fill="#2F6F73">$ whoami</text>
  <text x="108" y="188" class="sans pop d1" font-size="56" font-weight="800" fill="#2B2A28">Hi, I'm Sole<tspan fill="#C8553D">.</tspan></text>

  <!-- tagline with soft highlight -->
  <g class="pop d2">
    <rect x="108" y="220" width="340" height="14" rx="2" fill="#F3D9CF"/>
    <text x="110" y="230" class="sans" font-size="22" font-weight="600" fill="#2B2A28">Software Engineer · AI Engineer</text>
  </g>

  <text x="110" y="272" class="mono pop d3" font-size="15" fill="#6B675E">building agents, RAG &amp; MCP servers that actually ship<tspan class="cursor" fill="#C8553D">▍</tspan></text>

  <!-- right side: tags -->
  <g class="pop d2">
    <g transform="rotate(3 920 132)">
      <rect x="826" y="106" width="196" height="50" rx="25" fill="#2F6F73"/>
      <text x="924" y="137" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#FFFDF8">ReAct agents</text>
    </g>
    <g transform="rotate(-2 880 196)">
      <rect x="790" y="172" width="180" height="50" rx="25" fill="#F3D9CF" stroke="#C8553D" stroke-width="1.6"/>
      <text x="880" y="203" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#A8432E">RAG · MCP</text>
    </g>
    <g transform="rotate(2 970 252)">
      <rect x="888" y="228" width="170" height="46" rx="23" fill="#FFFDF8" stroke="#2B2A28" stroke-width="1.6"/>
      <text x="973" y="257" text-anchor="middle" class="mono" font-size="15" font-weight="600" fill="#2B2A28">Santa Fe, ARG</text>
    </g>
  </g>
</svg>
