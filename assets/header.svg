<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pop { animation: pop .6s ease-out both; transform-origin: center; transform-box: fill-box; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>

  <!-- background -->
  <rect width="1200" height="340" fill="#EEEFE9"/>
  <g fill="#D0D1C9">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="40" cy="80" r="2"/>
    <circle cx="1160" cy="300" r="2"/><circle cx="1120" cy="300" r="2"/><circle cx="1160" cy="260" r="2"/>
  </g>

  <!-- window shadow + window -->
  <rect x="78" y="44" width="1050" height="262" rx="10" fill="#151515"/>
  <rect x="70" y="36" width="1050" height="262" rx="10" fill="#FDFDF8" stroke="#151515" stroke-width="3"/>

  <!-- title bar -->
  <path d="M70 46 a10 10 0 0 1 10 -10 h1030 a10 10 0 0 1 10 10 v26 h-1050 z" fill="#E5E7E0" stroke="#151515" stroke-width="3"/>
  <circle cx="96" cy="54" r="7" fill="#F54E00" stroke="#151515" stroke-width="2"/>
  <circle cx="118" cy="54" r="7" fill="#F7A501" stroke="#151515" stroke-width="2"/>
  <circle cx="140" cy="54" r="7" fill="#1D4AFF" stroke="#151515" stroke-width="2"/>
  <text x="595" y="59" text-anchor="middle" class="mono" font-size="14" fill="#4D4F46">~/soleroa — README.md</text>

  <!-- content -->
  <text x="110" y="128" class="mono pop" font-size="18" fill="#F54E00" font-weight="700">$ whoami</text>
  <text x="108" y="190" class="sans pop d1" font-size="58" font-weight="800" fill="#151515">Hi, I'm Sole<tspan fill="#F54E00">.</tspan></text>

  <!-- highlighted tagline -->
  <g class="pop d2">
    <rect x="110" y="210" width="430" height="34" fill="#F7A501" stroke="#151515" stroke-width="2.5" transform="rotate(-1 325 227)"/>
    <text x="124" y="234" class="sans" font-size="22" font-weight="700" fill="#151515">Software Engineer · AI Engineer</text>
  </g>

  <text x="110" y="276" class="mono pop d3" font-size="16" fill="#4D4F46">building agents, RAG &amp; MCP servers that actually ship<tspan class="cursor" fill="#151515">█</tspan></text>

  <!-- right side: stacked sticker cards -->
  <g class="pop d2">
    <g transform="rotate(4 900 140)">
      <rect x="818" y="100" width="210" height="58" rx="6" fill="#1D4AFF" stroke="#151515" stroke-width="3"/>
      <text x="923" y="137" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#FFFFFF">ReAct agents</text>
    </g>
    <g transform="rotate(-3 900 200)">
      <rect x="780" y="168" width="200" height="58" rx="6" fill="#F54E00" stroke="#151515" stroke-width="3"/>
      <text x="880" y="205" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#FFFFFF">RAG · MCP</text>
    </g>
    <g transform="rotate(2 960 250)">
      <rect x="880" y="222" width="190" height="52" rx="6" fill="#FDFDF8" stroke="#151515" stroke-width="3"/>
      <text x="975" y="255" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#151515">Santa Fe, ARG</text>
    </g>
  </g>
</svg>
